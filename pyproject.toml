[project]
name = "support-agent"
version = "0.1.0"
description = "Customer support agent built step by step: from a basic LLM call to a production deployment"
readme = "README.md"
authors = [
    { name = "Epciy"}
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
support-agent = "support_agent.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
